# Builds the site with the exact Gemfile in this repo and publishes it to GitHub Pages.
# Using Actions rather than GitHub's classic Jekyll build means the deployed site is
# produced by the same Jekyll version you run locally.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Fail if the CV PDF leaked into the build
        run: |
          if find _site -iname '*_CV.pdf' -o -iname 'curriculum_vitae.pdf' | grep -q .; then
            echo "::error::A CV PDF was found in the built site. It must not be published."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
