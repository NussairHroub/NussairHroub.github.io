<!-- Shared <head> for every layout. Paths go through `relative_url` so that pages served
     from a sub-path (e.g. /blog/) resolve assets correctly. -->
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>{% if page.title and page.layout != 'homepage' %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.affiliation }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
{% if site.keywords %}<meta name="keywords" content="{{ site.keywords }}" />{% endif %}
{% if page.url == '/' and site.canonical %}
  <link rel="canonical" href="{{ site.canonical }}" />
{% else %}
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
{% endif %}

<meta property="og:title" content="{% if page.title and page.layout != 'homepage' %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />

<link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark | relative_url }}" type="image/png" />
<link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon | relative_url }}" type="image/png" />
<script src="{{ '/assets/js/favicon-switcher.js' | relative_url }}" type="application/javascript"></script>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css"
  integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw="
  crossorigin="anonymous"
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
  integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>

{% if site.font == "Sans Serif" %}
  <link rel="stylesheet" href="{{ '/assets/css/font_sans_serif.css' | relative_url }}" />
{% else %}
  <link rel="stylesheet" href="{{ '/assets/css/font.css' | relative_url }}" />
{% endif %}
{% if site.auto_dark_mode %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/publications.css' | relative_url }}" />
{% else %}
  <link rel="stylesheet" href="{{ '/assets/css/style-no-dark-mode.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/publications-no-dark-mode.css' | relative_url }}" />
{% endif %}
