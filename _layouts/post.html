<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <div class="wrapper">
      {% include header.html %}
      <section>
        <article>
          <h2 style="margin-top:0;">{{ page.title }}</h2>
          <p style="margin:-8px 0 20px;">
            <small>{{ page.date | date: "%b %-d, %Y" }}{% if page.tags and page.tags != empty %} &middot; {{ page.tags | join: ", " }}{% endif %}</small>
          </p>

          {{ content }}
        </article>

        <br />
        <p><a href="{{ '/blog/' | relative_url }}"><autocolor>&larr; All posts</autocolor></a></p>

        {% include footer.html %}
      </section>
      <footer></footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
    {% if site.google_analytics %}
      <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}');
      </script>
    {% endif %}
  </body>
</html>
